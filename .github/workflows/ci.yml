name: CI

# T1（2026-10-20）：README 挂绿徽章 = 项目是活的。
#
# 三个闸门，按「失败最快 → 慢」排：
#   ① ruff                       —— 真实缺陷类规则（未定义名 / 未用导入 / 语法错），几秒
#   ② 生成 CI 用合成 fixture 库   —— 见下方「为什么必须有这一步」
#   ③ pytest                     —— 默认口径，不联网、不读凭据、不调 LLM
#
# ## 为什么必须有「合成 fixture 库」这一步（血泪）
#
# 本项目库文件 data/db/olist.db（135 MB）由 Kaggle 的 Olist CSV 建出，**不入库**
# （.gitignore: data/raw/、data/db/*、*.db）。干净克隆里没有它，于是：
#
#     干净克隆实测：137 passed / 10 failed / 2 skipped
#     10 条全因 sqlite3.OperationalError（没有 orders 表）
#
# 也就是说「默认 147 passed / 2 skipped，任何机器一致」这句话当时**并不成立**，
# 成立的是「任何**建过库**的机器」。CI 在干净环境里跑，正好把这个缺口照出来了。
#
# 解法不是下载真数据集（要 Kaggle 账号 + 每次拉 58 MB），而是
# scripts/make_fixture_db.py 用 schema.py 的 DDL 生成合成库：
# 表结构真实、行数是合成的，够让「碰库」的用例跑通代码路径。
# 真实业务基数由 init_db.py 的 EXPECTED 校验与 METRICS.md 负责，不由单测负责。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 只测 3.12：requirements 与 mcp/pandas 的 wheel 组合在 3.12 上最稳
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # constraints.txt 也进缓存 key：锁定文件变了就该重新装，否则缓存会骗人
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: 安装依赖
        # ① ruff 是可选的开发依赖，没有进 requirements.txt（那里面只放运行时依赖）
        # ② `-c constraints.txt` 把**传递依赖**一起钉死：requirements.txt 里除 mcp 外
        #    全是 `>=`，不锁的话每次 CI 解析到的版本都可能不同 —— 2026-11-01 一次纯文档
        #    提交就让 CI 由绿转红，正是解析漂移把一条本来带竞态的用例稳定照出来的结果。
        run: pip install -r requirements.txt -c constraints.txt ruff

      - name: Lint（真实缺陷类规则，不打架格式风格）
        run: ruff check --select E9,F63,F7,F82,F401,F811,F841,F821,F822,F823 .

      - name: 生成 CI 用合成 fixture 库
        run: python scripts/make_fixture_db.py

      - name: 测试（默认口径，零外部依赖）
        # 不需要任何 key：真 LLM 用例由 RUN_SLOW=1 显式门控，默认 2 skipped
        #
        # 为什么要自己生成 annotation 而不是直接 `python -m pytest -q`：
        #   Actions 的原始日志要 admin 权限才下得下来（未授权 API 返回
        #   `403 Must have admin rights`），于是「CI 红了但看不到是哪个用例红」
        #   会变成一个纯猜测的过程。而 `::error::` 生成的 check annotation 是
        #   公开可读的（GET /check-runs/{id}/annotations 无需鉴权）。
        #
        # 为什么压成两条而不是一条一个：注解有条数上限（实测约 10 条，
        # 超出的被静默丢弃）。第一版的「一条 dep 一个注解」把最要紧的环境指纹
        # 挤掉了 —— 用一次真运行换来的教训。现在压成「失败摘要」+「依赖版本」两条，
        # 条数不随失败数增长。
        run: |
          set +e
          python -m pytest -q > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          if [ "$status" -ne 0 ]; then
            # 截断长度有讲究：用例自己的断言消息里往往已经带了完整诊断
            # （`test_mcp` 的 `_proc_diag()` 会给出 rc + stderr 尾巴 + stdout 尾巴）。
            # 第一版切到 160 字符，正好把诊断切没了 —— 只看到「降级模式必须能正常起来，
            # 否则……」而看不到它为什么没起来。现在 3000：够放下一整段 traceback。
            # 注意 `_proc_diag()` 刻意把多行压成一行：`grep '^FAILED'` 只认单行摘要，
            # 多行断言消息会被截到第一行，而 traceback 恰恰在后面。
            fails=$(grep -E '^(FAILED|ERROR) ' /tmp/pytest.log | head -3 | cut -c1-3000 | paste -sd ';' -)
            deps=$(python -m pip freeze 2>/dev/null \
              | grep -iE '^(langgraph|langchain[^=]*|openai|sqlparse|sqlalchemy|pandas|numpy|pydantic[^=]*|fastapi|uvicorn|sse-starlette|mcp)==' \
              | paste -sd ' ' -)
            envline="$(grep -h PRETTY_NAME /etc/os-release 2>/dev/null || echo os=unknown) | $(python -V 2>&1) | nproc=$(nproc)"
            echo "::error::pytest 退出码 $status | $envline | 失败：${fails:-（日志里没有 FAILED 行）}"
            echo "::error::本次安装的依赖（已按 constraints.txt 锁定；若与提交里的锁定文件不符，说明解析漂了）：${deps}"
            exit "$status"
          fi
